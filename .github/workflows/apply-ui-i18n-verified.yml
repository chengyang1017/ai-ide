name: Apply verified UI i18n

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-i18n-verified.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/finish-ui-i18n.yml').read_text(encoding='utf-8')
          a = "          cat > src/ui/runtime_i18n.ts <<'EOF'\n"
          b = "\n          EOF\n"
          start = workflow.find(a); end = workflow.find(b, start + len(a))
          if start < 0 or end < 0: raise SystemExit('translation template missing')
          payload = workflow[start + len(a):end]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines()) + '\n'
          Path('src/ui').mkdir(parents=True, exist_ok=True)
          Path('src/ui/runtime_i18n.ts').write_text(payload, encoding='utf-8')

          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p,t): Path(p).write_text(t, encoding='utf-8')
          def sub1(t, pattern, repl, label, flags=re.S):
              n, c = re.subn(pattern, repl, t, count=1, flags=flags)
              if c != 1: raise SystemExit(label + ' matcher failed')
              return n

          p='src/main.ts'; t=load(p)
          if "import './ui/runtime_i18n';" not in t:
              if "import './styles.css';" not in t: raise SystemExit('main import missing')
              t=t.replace("import './styles.css';", "import './styles.css';\nimport './ui/runtime_i18n';",1)
          save(p,t)

          for p,fn in [('src/agent/agent_panel.ts','isRealProjectOpen'),('src/agent/agent_follow.ts','isRealProjectOpen'),('src/terminal/terminal_panel.ts','isLocalProjectOpen')]:
              t=load(p)
              pattern=rf"function {fn}\(\): boolean \{{\s*return document\s*\.querySelector<HTMLElement>\('#workspace-badge'\)\s*\?\.textContent\s*\?\.trim\(\) === '真实项目';\s*\}}"
              repl=f"""function {fn}(): boolean {{
            const badge = document
              .querySelector<HTMLElement>('#workspace-badge')
              ?.textContent
              ?.trim() ?? '';
            return badge === '真实项目' || badge === 'Real Project';
          }}"""
              save(p,sub1(t,pattern,repl,p+' badge'))

          p='src/project/file_manager.ts'; t=load(p)
          t=sub1(t,r"function isRealProjectOpen\(\): boolean \{\s*return \(\s*document\.querySelector<HTMLElement>\(\s*'#workspace-badge',\s*\)\?\.textContent\?\.trim\(\)\s*=== '真实项目'\s*\);\s*\}","""function isRealProjectOpen(): boolean {
            const badge = document.querySelector<HTMLElement>(
              '#workspace-badge',
            )?.textContent?.trim() ?? '';
            return badge === '真实项目' || badge === 'Real Project';
          }""",'file manager badge')
          t=sub1(t,r"function hasUnsavedChanges\(\): boolean \{.*?\n\}","""function hasUnsavedChanges(): boolean {
            return document.querySelector<HTMLElement>(
              '#editor-tab-dot',
            )?.dataset.dirty === 'true';
          }""",'file manager dirty')
          save(p,t)

          p='src/project/file_manager_multiselect.ts'; t=load(p)
          t=sub1(t,r"function hasUnsavedChanges\(\): boolean \{.*?\n\}","""function hasUnsavedChanges(): boolean {
            return document
              .querySelector<HTMLElement>('#editor-tab-dot')
              ?.dataset.dirty === 'true';
          }""",'multiselect dirty')
          save(p,t)

          p='src/project/file_manager_create_dialog.ts'; t=load(p)
          t=sub1(t,r"function realProjectOpen\(\): boolean \{\s*return document\.querySelector<HTMLElement>\(\s*'#workspace-badge',\s*\)\?\.textContent\?\.trim\(\) === '真实项目';\s*\}","""function realProjectOpen(): boolean {
            const badge = document.querySelector<HTMLElement>(
              '#workspace-badge',
            )?.textContent?.trim() ?? '';
            return badge === '真实项目' || badge === 'Real Project';
          }""",'create dialog badge')
          if "if (text.includes('新建文件夹')) {" not in t or "if (text.includes('新建文件')) {" not in t: raise SystemExit('create action text missing')
          t=t.replace("if (text.includes('新建文件夹')) {","if (text.includes('新建文件夹') || text.includes('New Folder')) {",1)
          t=t.replace("if (text.includes('新建文件')) {","if (text.includes('新建文件') || text.includes('New File')) {",1)
          save(p,t)

          p='src/reader/reader_collab.ts'; t=load(p)
          t=sub1(t,r"workspaceBadge\s*=== '真实项目'\s*&& root\s*&& root\s*!== '尚未打开真实项目'","""(workspaceBadge === '真实项目'
              || workspaceBadge === 'Real Project')
              && root
              && root !== '尚未打开真实项目'
              && root !== 'No local project open'""",'reader workspace')
          save(p,t)

          p='src/android/android_reader_session.ts'; t=load(p)
          pattern=r"const realProject =\s*document\.querySelector<HTMLElement>\(\s*'#workspace-badge',\s*\)\?\.textContent\?\.trim\(\)\s*=== '真实项目';"
          repl="""const badge =
              document.querySelector<HTMLElement>(
                '#workspace-badge',
              )?.textContent?.trim() ?? '';
            const realProject =
              badge === '真实项目'
                || badge === 'Real Project';"""
          t2,c=re.subn(pattern,repl,t,count=1,flags=re.S)
          if c: save(p,t2)

          p='src/character/character_controller.ts'; t=load(p)
          if 'function tutorText(' not in t:
              marker='type AgentEditFocusDetail = {'
              if marker not in t: raise SystemExit('character helper marker missing')
              helper="""function tutorText(
            chinese: string,
            english: string,
          ): string {
            const language = document
              .querySelector<HTMLSelectElement>('#voice-language')
              ?.value
              ?.toLowerCase() ?? '';
            return language.startsWith('en') ? english : chinese;
          }

          """
              t=t.replace(marker,helper+marker,1)
          if 'this.bubble.textContent = `你问：${question}`;' not in t: raise SystemExit('question prefix missing')
          t=t.replace('this.bubble.textContent = `你问：${question}`;',"this.bubble.textContent = `${tutorText('你问：', 'You asked: ')}${question}`;",1)
          t=t.replace("message = '讲解已打断',","message = tutorText('讲解已打断', 'Explanation interrupted'),",1)
          t=t.replace("message = '等待操作',","message = tutorText('等待操作', 'Waiting for action'),",1)

          agent_pattern=re.compile(r"\s*const verb =\s*detail\.type === 'created'\s*\? '新建这段代码'\s*: detail\.oldPreview && detail\.newPreview\s*\? '把这里的旧代码换成新的实现'\s*: detail\.oldPreview\s*\? '删掉这里的旧代码'\s*: '在这里加入新代码';\s*\n\s*await this\.moveTo\(\{\s*filePath: detail\.filePath,\s*line: Math\.max\(1, detail\.line\),\s*column: 1,\s*speech: `我正在\$\{verb\}。你可以直接看编辑器里的红色删除和绿色新增。`,",re.S)
          agent_repl="""

            const speech =
              detail.type === 'created'
                ? tutorText(
                    '我正在新建这段代码。你可以直接看编辑器里的红色删除和绿色新增。',
                    'I am adding this code. You can watch the red deletions and green additions directly in the editor.',
                  )
                : detail.oldPreview && detail.newPreview
                  ? tutorText(
                      '我正在把这里的旧代码换成新的实现。你可以直接看编辑器里的红色删除和绿色新增。',
                      'I am replacing the old code with the new implementation. You can watch the red deletions and green additions directly in the editor.',
                    )
                  : detail.oldPreview
                    ? tutorText(
                        '我正在删掉这里的旧代码。你可以直接看编辑器里的红色删除和绿色新增。',
                        'I am removing the old code here. You can watch the red deletions and green additions directly in the editor.',
                      )
                    : tutorText(
                        '我正在这里加入新代码。你可以直接看编辑器里的红色删除和绿色新增。',
                        'I am adding new code here. You can watch the red deletions and green additions directly in the editor.',
                      );

            await this.moveTo({
              filePath: detail.filePath,
              line: Math.max(1, detail.line),
              column: 1,
              speech,"""
          t,c=agent_pattern.subn(agent_repl,t,count=1)
          if c != 1: raise SystemExit('agent robot speech regex failed')
          save(p,t)
          PY

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/ui/runtime_i18n.ts src/agent/agent_panel.ts src/agent/agent_follow.ts src/terminal/terminal_panel.ts src/project/file_manager.ts src/project/file_manager_multiselect.ts src/project/file_manager_create_dialog.ts src/reader/reader_collab.ts src/android/android_reader_session.ts src/character/character_controller.ts
          git commit -m "feat: complete English UI localization"
          git push origin HEAD:main
