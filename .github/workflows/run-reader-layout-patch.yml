name: Reader layout polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-reader-layout-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/reader_layout_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified layout changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css src/tablet.css src/layout/sidebar_resizer.ts src/reader/reader_editor_view_sync.ts src/reader/reader_surface.ts
          git commit -m "feat: align reader editor viewport and resize sidebar"
          git push origin HEAD:main
