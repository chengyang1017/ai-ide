name: Reader editor exact alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-reader-editor-alignment-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/fix_reader_editor_alignment.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified alignment fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reader/reader_surface.ts
          git commit -m "fix: keep reader and editor on identical viewport"
          git push origin HEAD:main
