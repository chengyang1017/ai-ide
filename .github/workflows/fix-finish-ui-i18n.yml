name: Fix UI i18n patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-finish-ui-i18n.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix patch matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dialog = Path('src/project/file_manager_create_dialog.ts')
          text = dialog.read_text(encoding='utf-8')
          old_folder = "if (text.includes('新建文件夹')) {"
          new_folder = "if (text.includes('新建文件夹') || text.includes('New Folder')) {"
          old_file = "if (text.includes('新建文件')) {"
          new_file = "if (text.includes('新建文件') || text.includes('New File')) {"
          if old_folder not in text or old_file not in text:
              raise SystemExit('file manager create-dialog matcher not found')
          text = text.replace(old_folder, new_folder, 1)
          text = text.replace(old_file, new_file, 1)
          dialog.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/finish-ui-i18n.yml')
          source = workflow.read_text(encoding='utf-8')
          start_marker = "          replace_once(\n              'src/project/file_manager_create_dialog.ts',\n              \"\"\"  if (text.includes('新建文件夹')) {"
          end_marker = "\n\n          reader = Path('src/reader/reader_collab.ts')"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('failed to find stale create-dialog workflow block')
          source = source[:start] + source[end:]
          workflow.write_text(source, encoding='utf-8')
          PY

      - name: Commit fix and retrigger patch
        shell: bash
        run: |
          rm -f .github/workflows/fix-finish-ui-i18n.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make UI localization patch resilient"
          git push origin HEAD:main
