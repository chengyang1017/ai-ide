databases:
  - name: ai-ide-collab-db
    plan: free
    region: singapore

services:
  - type: web
    name: ai-ide-collab
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ide-collab-db
          property: connectionString
